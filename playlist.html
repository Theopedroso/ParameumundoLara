<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Nossa Playlist 🎵</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">💗</span> ParaLara</div>
    <p class="nav-label">Navegar</p>
    <nav class="nav-links">
      <a href="index.html" data-page="index.html"><span class="ic">🏠</span> Início</a>
      <a href="playlist.html" data-page="playlist.html"><span class="ic">🎵</span> Playlist</a>
      <a href="fotos.html" data-page="fotos.html"><span class="ic">📸</span> Fotos</a>
      <a href="curiosidades.html" data-page="curiosidades.html"><span class="ic">💭</span> Curiosidades</a>
    </nav>
    <div class="sidebar-footer">
      <div class="together-counter">
        <div class="label">Juntos há</div>
        <div class="value" id="togetherCompact">--</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="playlist-hero" id="playlistHero">
      <div class="vinyl"></div>
      <div class="playlist-hero-info">
        <h1>Nossa Playlist</h1>
        <p>Uma música de cada vez, do jeito que essas coisas merecem ser ouvidas.</p>
      </div>
    </div>

    <section class="player-stage">
      <article class="player-card is-visible" id="playerCard">
        <div class="player-top">
          <span class="player-counter" id="playerCounter">Faixa 01</span>
          <span class="player-track-name" id="playerTrackName"></span>
        </div>

        <blockquote class="player-quote">
          <p class="player-phrase" id="playerPhrase"></p>
        </blockquote>

        <div class="player-embed" id="playerEmbed"></div>
      </article>

      <div class="player-nav">
        <button class="player-arrow" id="prevTrack" aria-label="Música anterior">‹</button>
        <div class="player-dots" id="playerDots"></div>
        <button class="player-arrow" id="nextTrack" aria-label="Próxima música">›</button>
      </div>
    </section>
  </main>
</div>

<nav class="bottom-nav">
  <a href="index.html" data-page="index.html"><span class="ic">🏠</span>Início</a>
  <a href="playlist.html" data-page="playlist.html"><span class="ic">🎵</span>Playlist</a>
  <a href="fotos.html" data-page="fotos.html"><span class="ic">📸</span>Fotos</a>
  <a href="curiosidades.html" data-page="curiosidades.html"><span class="ic">💭</span>Curiosidades</a>
</nav>

<script src="js/main.js"></script>
<script src="js/playlist.js"></script>
</body>
</html>
