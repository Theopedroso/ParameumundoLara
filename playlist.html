<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Nossa Playlist 🎵</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">💗</span> ParaLara</div>
    <nav class="nav-links">
      <a href="index.html" data-page="index.html"><span class="ic">🏠</span> Início</a>
      <a href="playlist.html" data-page="playlist.html"><span class="ic">🎵</span> Playlist</a>
      <a href="fotos.html" data-page="fotos.html"><span class="ic">📸</span> Fotos</a>
      <a href="curiosidades.html" data-page="curiosidades.html"><span class="ic">💭</span> Curiosidades</a>
    </nav>
    <div class="sidebar-footer">
      <div class="together-counter">
        <div class="label">Juntos há</div>
        <div class="value" id="togetherCompact">--</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="playlist-hero" id="playlistHero">
      <div class="vinyl"></div>
      <div class="playlist-hero-info">
        <h1>Nossa Playlist 🎶</h1>
        <p>As músicas que contam a nossa história. Toque em qualquer uma pra abrir o player.</p>
        <div class="playlist-stats">
          <span>🎵 <span id="trackCount">13</span> faixas</span>
          <span>💗 feita com carinho</span>
        </div>
      </div>
    </div>

    <div class="playlist-list" id="playlistList">
      <!-- gerado por js/playlist.js -->
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a href="index.html" data-page="index.html"><span class="ic">🏠</span>Início</a>
  <a href="playlist.html" data-page="playlist.html"><span class="ic">🎵</span>Playlist</a>
  <a href="fotos.html" data-page="fotos.html"><span class="ic">📸</span>Fotos</a>
  <a href="curiosidades.html" data-page="curiosidades.html"><span class="ic">💭</span>Curiosidades</a>
</nav>

<script src="js/main.js"></script>
<script src="js/playlist.js"></script>
</body>
</html>
